<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Portal — Profile Settings</title>
  <link rel="stylesheet" href="css/profile.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="portal-shell">
    <header class="portal-header">
      <div class="portal-header__brand">
        <span class="portal-header__logo" aria-hidden="true">SP</span>
        <div>
          <p class="portal-header__eyebrow">University Student Portal</p>
          <h1 class="portal-header__title">Profile Settings</h1>
        </div>
      </div>
      <p class="portal-header__subtitle">
        Update your account information. All fields are required for verification.
      </p>
    </header>

    <main class="portal-main">
      <form id="profile-form" class="profile-form" novalidate>
        <section class="form-section" aria-labelledby="account-heading">
          <h2 id="account-heading" class="form-section__title">Account Information</h2>

          <div class="form-field">
            <label for="student-id" class="form-field__label">Student ID</label>
            <input
              type="text"
              id="student-id"
              name="studentId"
              class="form-field__input"
              placeholder="e.g., STU12345"
              autocomplete="username"
              required
            >
            <p id="student-id-error" class="form-field__error" role="alert" aria-live="polite"></p>
          </div>

          <div class="form-field">
            <label for="full-name" class="form-field__label">Full Name</label>
            <input
              type="text"
              id="full-name"
              name="fullName"
              class="form-field__input"
              placeholder="Enter your full legal name"
              autocomplete="name"
              required
            >
            <p id="full-name-error" class="form-field__error" role="alert" aria-live="polite"></p>
          </div>

          <div class="form-field">
            <label for="institutional-email" class="form-field__label">Institutional Email</label>
            <input
              type="email"
              id="institutional-email"
              name="institutionalEmail"
              class="form-field__input"
              placeholder="you@university.edu"
              autocomplete="email"
              required
            >
            <p id="institutional-email-error" class="form-field__error" role="alert" aria-live="polite"></p>
          </div>

          <div class="form-field">
            <label for="account-password" class="form-field__label">Account Password</label>
            <input
              type="password"
              id="account-password"
              name="accountPassword"
              class="form-field__input"
              placeholder="Minimum 8 characters"
              autocomplete="new-password"
              required
            >
            <p id="account-password-error" class="form-field__error" role="alert" aria-live="polite"></p>
            <p class="form-field__hint">
              Must be at least 8 characters and include one number and one special character.
            </p>
          </div>
        </section>

        <div class="form-actions">
          <button type="button" class="btn btn--secondary" id="reset-btn">Reset</button>
          <button type="submit" class="btn btn--primary">Save Changes</button>
        </div>

        <p id="form-success" class="form-success" role="status" aria-live="polite"></p>
      </form>
    </main>

    <footer class="portal-footer">
      <p>&copy; 2026 University Student Portal. Secure access for enrolled students.</p>
    </footer>
  </div>

  <script src="js/profile.js"></script>
</body>
</html>
